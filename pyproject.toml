[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server"
version = "1.0.4"
description = "Modular Command Provider — exposes CLI commands as model tools."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",  # used by services (gitea, ics, notify, weather, client)
    "httpx2>=2.5",  # HTTP transport required by the mcp SDK (v2)
    "caldav>=1.3",
    "icalendar>=6.0",
    "recurring-ical-events>=2.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "httpx2>=2.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Starlette's TestClient emits a deprecation warning about httpx
    # usage; ignore it until we migrate to httpx's native ASGI transport.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
