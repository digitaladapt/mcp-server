# .gitea/workflows/tests.yaml — runs lint + tests on every push and PR.
#
# Gitea Actions is GitHub-compatible, so this uses the standard
# actions/checkout and actions/setup-python syntax.

name: Tests

on:
  push:
    branches:
      - 'main'
      - 'feat*'
      - 'fix*'
      - 'cleanup*'
      - 'chore*'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3   # standalone binary, no python, no cache

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5     # no cache: key — uv handles caching
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Run pytest
        run: pytest -v
