# log.yaml – append a timestamped message to a log file.
#
# Pivots the old "hello" command into a useful logging utility.
# The log file is controlled by MCP_LOG_FILE or MCP_LOG_DIR env vars,
# defaulting to /tmp/mcp/mcp.log.

name: log
description: Append a timestamped message to the MCP log file.
executable: scripts/log.sh
requires:
  - "MCP_LOG_ENABLED != false"
args:
  - name: --level
    type: string
    required: false
    field_name: level
    choices:
      - info
      - warn
      - error
    default: info
    help: Log level.
  - name: message
    type: string
    required: true
    help: Message to log.
