# php_eval.yaml – runs a PHP script file.
# Only works in the mcp-server:php variant (or any image with php-cli).
#
# Example: mc.execute("php_eval", script="/app/scripts/hello.php")

name: php_eval
description: Run a PHP script file.
executable: /usr/bin/php
args:
  - name: script
    type: string
    required: true
    help: Path to the PHP script to execute.
  - name: -d
    type: string
    required: false
    help: Set a php.ini directive (e.g. memory_limit=256M).
