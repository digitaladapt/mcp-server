# discord.yaml – wraps /home/user/discord.sh for sending Discord messages.
#
# -q (quiet) is forced ON via `default: true` so the MCP always suppresses
# the script's input-echo.  Callers never need to (and generally shouldn't)
# pass it.
#
# Argument order matters: flags come first, then the positional `message`,
# matching how discord.sh parses its argv.

name: discord
description: Send a Discord message.
executable: scripts/discord.sh
args:
  # --- flags (must precede the message) -------------------------------
  - name: -q
    type: flag
    required: false
    default: true
    hidden: true
    help: Quiet mode (forced on).
  - name: -a
    type: flag
    required: false
    field_name: alert
    help: Send as a high-priority alert.
  - name: -c
    type: string
    required: false
    field_name: color
    choices:
      - maroon
      - brown
      - olive
      - teal
      - navy
      - black
      - red
      - orange
      - yellow
      - lime
      - green
      - cyan
      - blue
      - purple
      - magenta
      - grey
      - pink
      - apricot
      - beige
      - mint
      - lavender
      - white
    help: Embed color.
  - name: -t
    type: string
    required: false
    field_name: title
    help: Message title.
  # --- positional -----------------------------------------------------
  - name: message
    type: string
    required: true
    help: Message body.
