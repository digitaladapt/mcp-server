# hello.yaml – a simple greeting command using echo.

name: hello
description: Prints a friendly greeting to a name.
executable: /bin/echo
args:
  - name: name
    type: string
    required: true
    help: Name of the person to greet.
  - name: --upper
    type: flag
    required: false
    help: Print the greeting in upper-case (requires `tr` via shell).
