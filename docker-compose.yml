# docker-compose.yml – easy local development & deployment of MCP Server.
#
# Usage:
#   1. cp .env.example .env   and fill in DISCORD_GENERAL_HOOK
#   2. docker compose up -d
#   3. curl http://localhost:8000/commands
#
# The registry/ directory is mounted as a volume so you can add/edit
# command definitions without rebuilding the image.
#
# Discord configuration is provided via environment variables (see .env).
# Alternatively, you can mount a config.sh file (see commented volume below).

services:
  mcp-server:
    build: .
    image: mcp-server:latest
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Override or extend command definitions at runtime.
      - ./registry:/app/registry
      # Optional: mount a config.sh for discord.sh instead of using env vars.
      # Uncomment if you prefer file-based config over .env:
      # - ./scripts/config.sh:/app/scripts/config.sh:ro
    env_file:
      # Path to your .env file (see .env.example).
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-UTC}
      - MCP_LOG_FILE=${MCP_LOG_FILE:-/tmp/mcp/mcp.log}
      - MCP_API_KEY=${MCP_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
