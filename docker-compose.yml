# docker-compose.yml – easy local deployment of MCP Server.
#
# Usage:
#   1. cp .env.example .env   and fill in the integrations you need
#   2. docker compose up -d
#   3. curl http://localhost:8000/api/health
#      curl -X POST http://localhost:8000/log -H 'Content-Type: application/json' \
#           -d '{"message": "hello"}'
#
# The registry/ directory is mounted as a volume so you can add/edit
# command definitions without rebuilding the image.
#
# Integration configuration is provided via environment variables (see .env).

services:
  mcp-server:
    build: .
    image: digitaladapt/mcp-server:latest
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Override or extend command definitions at runtime.
      - ./registry:/app/registry
    env_file:
      # Path to your .env file (see .env.example).
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-UTC}
      - MCP_LOG_FILE=${MCP_LOG_FILE:-/tmp/mcp/mcp.log}
      - MCP_LOG_ENABLED=${MCP_LOG_ENABLED:-true}
      - MCP_API_KEY=${MCP_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
